<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memocab</title>
<meta name="theme-color" content="#152A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memocab">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --ink:#152A33;--ink-soft:#40575F;--paper:#EDEFE9;--slip:#FBFBF7;--rule:#C9D0C9;
  --pen:#1F4FA3;--stamp:#8F9C93;--flag:#E4C55A;--danger:#A8402F;
  --serif:Georgia,"Songti SC","Noto Serif CJK SC",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

header{background:var(--ink);color:var(--paper);padding:14px 18px 0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.wrap{max-width:760px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#93A5A9;white-space:nowrap}
.lang{margin-left:auto;display:inline-flex;border:1px solid #3D5560;border-radius:2px;overflow:hidden;flex:none}
.lang button{background:transparent;border:0;padding:5px 9px;color:#93A5A9;font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.capture{background:var(--ink);padding:14px 18px 18px}
.capture .box{background:var(--slip);border-radius:3px;padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-bottom:10px}
.seg button{background:transparent;border:0;padding:5px 14px;color:var(--ink-soft);font-size:13px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--slip)}
textarea,input[type=text]{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;font-family:inherit;font-size:17px;color:var(--ink);padding:6px 0;resize:none}
textarea:focus,input:focus{outline:none;border-bottom-color:var(--pen)}
#field-text{font-family:var(--serif);font-size:20px}
.field-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--stamp);margin-top:12px}
.capture .row{display:flex;gap:10px;align-items:center;margin-top:14px}
.btn{background:var(--ink);color:var(--slip);border:0;border-radius:2px;padding:9px 20px;letter-spacing:.03em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-family:var(--mono);font-size:11px;color:var(--stamp)}

.toolbar{max-width:760px;margin:0 auto;padding:16px 18px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:18px;margin-right:auto}
.tab{background:none;border:0;padding:0 0 4px;color:var(--ink-soft);font-size:14px;letter-spacing:.03em;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--stamp);margin-left:5px}
.tab b.hot{color:var(--slip);background:var(--danger);padding:1px 5px;border-radius:8px}
.search{flex:1 1 160px;border:1px solid var(--rule);background:var(--slip);border-radius:2px;padding:6px 10px;font-size:14px}
.export{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:2px;padding:6px 12px;font-size:13px}
.ghost:hover{background:var(--ink);color:var(--slip)}

main{max-width:760px;margin:0 auto;padding:16px 18px 60px}
.slip{display:flex;background:var(--slip);border:1px solid var(--rule);border-radius:2px;margin-bottom:12px;overflow:hidden}
.spine{flex:0 0 34px;background:#E3E7E0;border-right:1px solid var(--rule);display:flex;align-items:center;justify-content:center}
.spine time{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--stamp);padding:10px 0;white-space:nowrap}
.body{flex:1;padding:12px 14px;min-width:0}
.term{font-family:var(--serif);font-size:22px;line-height:1.3;word-break:break-word}
.slip.sentence .term{font-size:18px;font-style:italic;line-height:1.55}
.meaning{margin-top:6px;color:var(--ink-soft);font-size:15px;word-break:break-word}
.meaning.empty{color:var(--stamp);font-size:13px;border-bottom:1px dashed var(--rule);display:inline-block;padding-bottom:2px}
.acts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center}
.acts button{background:none;border:0;padding:0;color:var(--pen);font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.acts button.del{color:var(--danger)}
.sched{font-family:var(--mono);font-size:11px;color:var(--stamp);letter-spacing:.06em;margin-left:auto}
.flag{display:inline-block;background:var(--flag);color:#3A3005;font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:2px 6px;border-radius:2px;margin-left:8px;vertical-align:3px}
.edit textarea{font-size:15px;font-family:var(--sans)}
.edit .row{display:flex;gap:12px;margin-top:10px;align-items:center;flex-wrap:wrap}
.empty-state{border:1px dashed var(--rule);border-radius:2px;padding:34px 20px;text-align:center;color:var(--ink-soft)}
.empty-state p{margin:0 0 6px;font-family:var(--serif);font-size:18px}
.empty-state small{font-family:var(--mono);font-size:11px;color:var(--stamp);letter-spacing:.06em}
mark{background:var(--flag);color:inherit}

.drill{background:var(--slip);border:1px solid var(--rule);border-radius:2px;padding:26px 20px 20px;text-align:center}
.drill .count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--stamp);text-transform:uppercase}
.drill .front{font-family:var(--serif);font-size:32px;line-height:1.3;margin:22px 0;word-break:break-word}
.drill.sentence .front{font-size:22px;font-style:italic;line-height:1.55}
.drill .back{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px;font-size:17px;color:var(--ink-soft);text-align:left;word-break:break-word}
.grades{display:flex;gap:8px;margin-top:20px}
.grades button{flex:1;border:1px solid var(--rule);background:transparent;border-radius:2px;padding:10px 4px;color:var(--ink);line-height:1.3;font-size:14px}
.grades button:hover{border-color:var(--ink)}
.grades small{display:block;font-family:var(--mono);font-size:10px;color:var(--stamp);margin-top:3px;letter-spacing:.06em}
.reveal{width:100%;background:var(--ink);color:var(--slip);border:0;border-radius:2px;padding:11px;margin-top:6px}
.drill-note{font-family:var(--mono);font-size:11px;color:var(--stamp);text-align:center;margin-top:14px;letter-spacing:.05em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--slip);padding:9px 16px;border-radius:2px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:560px){
  .spine{flex-basis:26px}.spine time{font-size:9px}.term{font-size:20px}
  .brand span{display:none}
  .drill .front{font-size:26px}
  .grades{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <div class="brand"><h1>Memocab</h1><span id="tagline"></span></div>
    <div class="lang" role="group" id="lang-group">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="ms">BM</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<div class="capture">
  <div class="wrap">
    <div class="box">
      <div class="seg" role="group" id="type-group">
        <button type="button" id="t-word" aria-pressed="true"></button>
        <button type="button" id="t-sentence" aria-pressed="false"></button>
      </div>
      <label class="field-label" for="field-text" id="l-text"></label>
      <textarea id="field-text" rows="1"></textarea>
      <label class="field-label" for="field-meaning" id="l-meaning"></label>
      <textarea id="field-meaning" rows="1"></textarea>
      <div class="row">
        <button class="btn" id="save" disabled></button>
        <span class="hint" id="clock"></span>
      </div>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-review" role="tab" aria-selected="false"><span></span><b id="c-due">0</b></button>
    <button class="tab" id="tab-active" role="tab" aria-selected="true"><span></span><b id="c-active">0</b></button>
    <button class="tab" id="tab-archive" role="tab" aria-selected="false"><span></span><b id="c-arch">0</b></button>
  </div>
  <input class="search" id="search" type="text">
  <div class="export">
    <button class="ghost" id="x-xls"></button>
    <button class="ghost" id="x-csv"></button>
  </div>
</div>

<main id="list"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='wordslip:entries';        // 不要改：改了会读不到旧资料
const LANGKEY='memocab:lang';
const DAY=86400000;
let entries=[], view='active', manualType=false, type='word', editing=null;
let queue=[], revealed=false, lang='zh';

/* ---------- 文字表 ---------- */
const I18N={
 zh:{htmlLang:'zh-Hans',tagline:'生词簿',

  tExported:n=>'已导出 '+n,tBlocked:'浏览器阻止了下载',tEmptyText:'内容不能空着',
  tNothing:'还没有内容可以导出',tSaveFail:'保存失败，浏览器不允许存储',
  confirmDel:t=>'删除「'+t+'」？删掉就找不回来了。',

  vWord:'单词',vSentence:'句子',vArchived:'已归档',vActive:'在用'},

 ms:{htmlLang:'ms',tagline:'Buku kata',
  word:'Perkataan',sentence:'Ayat',
  lText:'Perkataan / ayat',pText:'Tulis apa yang anda pelajari hari ini',
  lMeaning:'Maksud (boleh kosong, isi kemudian)',pMeaning:'Penerangan, terjemahan, contoh ayat…',
  saveBtn:'Simpan',search:'Cari…',
  tabReview:'Ulang kaji',tabActive:'Aktif',tabArchive:'Arkib',
  xls:'Eksport Excel',csv:'Eksport CSV',
  edit:'Edit',archive:'Arkib',restore:'Pulih',del:'Padam',
  save:'Simpan',cancel:'Batal',reset:'Set semula ulang kaji',
  meaningLabel:'Maksud',noMeaning:'Belum ada maksud — tekan Edit untuk isi',archived:'Diarkib',
  due:'Perlu diulang',next:d=>'Seterusnya '+d,times:n=>' · '+n+' kali',
  reveal:'Tunjuk maksud',gForgot:'Lupa',gHard:'Ingat selepas fikir',gGood:'Terus ingat',
  drillCount:(n,m)=>'Tinggal '+n+' · sudah diulang '+m+' kali',
  drillAddMeaning:'Belum ada maksud — isi sekarang',
  noteReveal:'Tekan space untuk buka',noteGrade:'Tekan 1 / 2 / 3 untuk nilai',
  gap:d=>d===0?'10 minit':d===1?'1 hari':d+' hari',
  emptyReview:'Tiada apa untuk diulang sekarang.',emptyAll:'Belum ada rekod.',
  emptyArchive:'Arkib masih kosong.',emptySearch:'Tiada rekod yang sepadan.',
  subNext:t=>'Seterusnya: '+t,subFirst:'Simpan beberapa perkataan dahulu',subSearch:'Cuba perkataan lain',
  subArchive:'Simpan kata yang sudah dikuasai di sini',subStart:'Tulis perkataan pertama di atas',
  tSaved:t=>'Disimpan · '+t,tUpdated:'Dikemas kini',tArchived:'Diarkib',tRestored:'Dipulihkan',
  tDeleted:'Dipadam',tReset:'Ulang kaji ditetapkan semula',tNext:g=>'Ulang kaji seterusnya: '+g,
  tExported:n=>'Dieksport '+n,tBlocked:'Pelayar menyekat muat turun',tEmptyText:'Kandungan tidak boleh kosong',
  tNothing:'Tiada apa untuk dieksport',tSaveFail:'Gagal simpan — pelayar tidak benarkan storan',
  confirmDel:t=>'Padam "'+t+'"? Tidak boleh dipulihkan.',
  head:['Jenis','Kandungan','Maksud','Masa direkod','Status','Masa arkib','Kali ulang kaji','Ulang kaji seterusnya','Selang (hari)','Kemudahan'],
  vWord:'Perkataan',vSentence:'Ayat',vArchived:'Diarkib',vActive:'Aktif'},

 en:{htmlLang:'en',tagline:'Word notebook',
  word:'Word',sentence:'Sentence',
  lText:'Word / sentence',pText:'Write what you learned today',
  lMeaning:'Meaning (optional, add it later)',pMeaning:'Definition, translation, example…',
  saveBtn:'Save',search:'Search…',
  tabReview:'Review',tabActive:'Active',tabArchive:'Archive',
  xls:'Export Excel',csv:'Export CSV',
  edit:'Edit',archive:'Archive',restore:'Restore',del:'Delete',
  save:'Save',cancel:'Cancel',reset:'Reset review progress',
  meaningLabel:'Meaning',noMeaning:'No meaning yet — tap Edit to add one',archived:'Archived',
  due:'Due now',next:d=>'Next '+d,times:n=>' · '+n+'×',
  reveal:'Show meaning',gForgot:'Forgot',gHard:'Recalled slowly',gGood:'Knew it',
  drillCount:(n,m)=>n+' left · reviewed '+m+' times',
  drillAddMeaning:'No meaning yet — add it now',
  noteReveal:'Press space to flip',noteGrade:'Press 1 / 2 / 3 to grade',
  gap:d=>d===0?'10 min':d===1?'1 day':d+' days',
  emptyReview:'Nothing to review right now.',emptyAll:'No entries yet.',
  emptyArchive:'The archive is empty.',emptySearch:'No matching entries.',
  subNext:t=>'Next one: '+t,subFirst:'Save a few words and come back',subSearch:'Try another word',
  subArchive:'Move words you have finished with here',subStart:'Write your first word above',
  tSaved:t=>'Saved · '+t,tUpdated:'Updated',tArchived:'Archived',tRestored:'Restored',
  tDeleted:'Deleted',tReset:'Review progress reset',tNext:g=>'Next review: '+g,
  tExported:n=>'Exported '+n,tBlocked:'The browser blocked the download',tEmptyText:'Content cannot be empty',
  tNothing:'Nothing to export yet',tSaveFail:'Could not save — storage is blocked',
  confirmDel:t=>'Delete "'+t+'"? This cannot be undone.',

  vWord:'Word',vSentence:'Sentence',vArchived:'Archived',vActive:'Active'}
};
const T=()=>I18N[lang];

/* ---------- 储存 ---------- */
async function getItem(k){
  if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){return null}}
  try{return localStorage.getItem(k)}catch(e){return null}
}
async function setItem(k,v){
  if(window.storage){try{await window.storage.set(k,v);return true}catch(e){}}
  try{localStorage.setItem(k,v);return true}catch(e){return false}
}
async function load(){
  const v=await getItem(KEY);
  let raw=[];
  try{raw=v?JSON.parse(v):[]}catch(e){raw=[]}
  return raw.map(normalize);
}
async function save(){
  const ok=await setItem(KEY,JSON.stringify(entries));
  if(!ok)toast(T().tSaveFail);
}
function normalize(e){
  if(e.reps===undefined)e.reps=0;
  if(e.ease===undefined)e.ease=2.5;
  if(e.interval===undefined)e.interval=0;
  if(e.reviewCount===undefined)e.reviewCount=0;
  if(e.lastReviewed===undefined)e.lastReviewed=null;
  if(!e.due)e.due=e.created;
  return e;
}

/* ---------- 小工具 ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function stamp(iso){const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dateOnly(iso){const d=new Date(iso);return pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hl(s,q){const t=esc(s);if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}
let toastTimer;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1900)}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function isDue(e){return !e.archived && new Date(e.due).getTime()<=Date.now()}

/* ---------- 语言 ---------- */
function detectLang(){
  const n=(navigator.language||'en').toLowerCase();
  if(n.startsWith('zh'))return 'zh';
  if(n.startsWith('ms')||n.startsWith('id'))return 'ms';
  return 'en';
}
function applyLang(){
  const t=T();
  document.documentElement.lang=t.htmlLang;
  $('tagline').textContent=t.tagline;
  $('t-word').textContent=t.word;
  $('t-sentence').textContent=t.sentence;
  $('l-text').textContent=t.lText;
  $('field-text').placeholder=t.pText;
  $('l-meaning').textContent=t.lMeaning;
  $('field-meaning').placeholder=t.pMeaning;
  $('save').textContent=t.saveBtn;
  $('search').placeholder=t.search;
  $('search').setAttribute('aria-label',t.search);
  $('tab-review').querySelector('span').textContent=t.tabReview;
  $('tab-active').querySelector('span').textContent=t.tabActive;
  $('tab-archive').querySelector('span').textContent=t.tabArchive;
  $('x-xls').textContent=t.xls;
  $('x-csv').textContent=t.csv;
  $('type-group').setAttribute('aria-label',t.lText);
  $('lang-group').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
}
$('lang-group').addEventListener('click',async ev=>{
  const b=ev.target.closest('button[data-lang]');
  if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;
  await setItem(LANGKEY,lang);
  applyLang();render();
});

/* ---------- SM-2 排程 (Wozniak 1987) ---------- */
function schedule(e,q){
  let ease=e.ease+(0.1-(5-q)*(0.08+(5-q)*0.02));
  if(ease<1.3)ease=1.3;
  let reps=e.reps,interval;
  if(q<3){
    reps=0;interval=0;
    e.due=new Date(Date.now()+10*60000).toISOString();
  }else{
    reps+=1;
    if(reps===1)interval=1;
    else if(reps===2)interval=6;
    else interval=Math.max(1,Math.round((e.interval||1)*ease));
    e.due=new Date(Date.now()+interval*DAY).toISOString();
  }
  e.ease=Math.round(ease*100)/100;
  e.reps=reps;e.interval=interval;
  e.reviewCount+=1;e.lastReviewed=new Date().toISOString();
  return interval;
}
function preview(e,q){return schedule(Object.assign({},e),q)}

/* ---------- 输入 ---------- */
function setType(t){type=t;$('t-word').setAttribute('aria-pressed',t==='word');$('t-sentence').setAttribute('aria-pressed',t==='sentence')}
$('t-word').onclick=()=>{manualType=true;setType('word')};
$('t-sentence').onclick=()=>{manualType=true;setType('sentence')};
$('field-text').addEventListener('input',e=>{
  autoGrow(e.target);
  $('save').disabled=!e.target.value.trim();
  if(!manualType){
    const words=e.target.value.trim().split(/\s+/).filter(Boolean).length;
    setType(words>=4?'sentence':'word');
  }
});
$('field-meaning').addEventListener('input',e=>autoGrow(e.target));
$('field-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();add()}});

async function add(){
  const text=$('field-text').value.trim();
  if(!text)return;
  const now=new Date().toISOString();
  entries.unshift(normalize({
    id:Date.now()+'-'+Math.random().toString(36).slice(2,7),
    type:type,text:text,meaning:$('field-meaning').value.trim(),
    created:now,archived:false,archivedAt:null,due:now
  }));
  await save();
  $('field-text').value='';$('field-meaning').value='';
  autoGrow($('field-text'));autoGrow($('field-meaning'));
  $('save').disabled=true;manualType=false;setType('word');
  view='active';syncTabs();render();
  toast(T().tSaved(stamp(now)));
  $('field-text').focus();
}
$('save').onclick=add;

/* ---------- 分页 ---------- */
function syncTabs(){
  $('tab-review').setAttribute('aria-selected',view==='review');
  $('tab-active').setAttribute('aria-selected',view==='active');
  $('tab-archive').setAttribute('aria-selected',view==='archive');
}
$('tab-review').onclick=()=>{view='review';editing=null;buildQueue();syncTabs();render()};
$('tab-active').onclick=()=>{view='active';editing=null;syncTabs();render()};
$('tab-archive').onclick=()=>{view='archive';editing=null;syncTabs();render()};
$('search').addEventListener('input',()=>{if(view==='review'){view='active';syncTabs()}render()});
function buildQueue(){
  queue=entries.filter(isDue).sort((a,b)=>new Date(a.due)-new Date(b.due)).map(e=>e.id);
  revealed=false;
}

/* ---------- 画面 ---------- */
function render(){
  const dueCount=entries.filter(isDue).length;
  $('c-active').textContent=entries.filter(e=>!e.archived).length;
  $('c-arch').textContent=entries.filter(e=>e.archived).length;
  const badge=$('c-due');badge.textContent=dueCount;badge.className=dueCount?'hot':'';
  if(view==='review')renderReview();else renderList();
}

function renderReview(){
  const t=T(),list=$('list');
  const e=entries.find(x=>x.id===queue[0]);
  if(!e||!isDue(e)){
    if(queue.length){queue.shift();return renderReview()}
    const next=entries.filter(x=>!x.archived).sort((a,b)=>new Date(a.due)-new Date(b.due))[0];
    list.innerHTML='<div class="empty-state"><p>'+(entries.length?t.emptyReview:t.emptyAll)+'</p><small>'+
      (next?t.subNext(stamp(next.due)):t.subFirst)+'</small></div>';
    return;
  }
  const back=e.meaning
    ? '<div class="back">'+esc(e.meaning)+'</div>'
    : '<div class="back"><label class="field-label" for="drill-meaning">'+t.drillAddMeaning+'</label><textarea id="drill-meaning" rows="1" placeholder="'+esc(t.pMeaning)+'"></textarea></div>';
  list.innerHTML='<div class="drill '+e.type+'">'+
    '<div class="count">'+t.drillCount(queue.length,e.reviewCount)+'</div>'+
    '<div class="front">'+esc(e.text)+'</div>'+
    (revealed
      ? back+'<div class="grades">'+
          '<button data-q="1">'+t.gForgot+'<small>'+t.gap(preview(e,1))+'</small></button>'+
          '<button data-q="3">'+t.gHard+'<small>'+t.gap(preview(e,3))+'</small></button>'+
          '<button data-q="5">'+t.gGood+'<small>'+t.gap(preview(e,5))+'</small></button></div>'
      : '<button class="reveal" id="do-reveal">'+t.reveal+'</button>')+
    '</div><div class="drill-note">'+(revealed?t.noteGrade:t.noteReveal)+'</div>';
  const ta=$('drill-meaning');if(ta)autoGrow(ta);
}

function renderList(){
  const t=T(),q=$('search').value.trim(),ql=q.toLowerCase();
  const rows=entries.filter(e=>e.archived===(view==='archive'))
    .filter(e=>!ql||e.text.toLowerCase().includes(ql)||(e.meaning||'').toLowerCase().includes(ql));
  const list=$('list');
  if(!rows.length){
    list.innerHTML='<div class="empty-state"><p>'+
      (q?t.emptySearch:view==='archive'?t.emptyArchive:t.emptyAll)+'</p><small>'+
      (q?t.subSearch:view==='archive'?t.subArchive:t.subStart)+'</small></div>';
    return;
  }
  list.innerHTML=rows.map(e=>{
    if(editing===e.id){
      return '<article class="slip '+e.type+'"><div class="spine"><time>'+stamp(e.created)+'</time></div>'+
        '<div class="body edit">'+
        '<textarea class="e-text" rows="1">'+esc(e.text)+'</textarea>'+
        '<label class="field-label">'+t.meaningLabel+'</label>'+
        '<textarea class="e-meaning" rows="1" placeholder="'+esc(t.pMeaning)+'">'+esc(e.meaning||'')+'</textarea>'+
        '<div class="row"><button class="btn" data-act="save" data-id="'+e.id+'">'+t.save+'</button>'+
        '<button class="ghost" data-act="cancel" data-id="'+e.id+'">'+t.cancel+'</button>'+
        (e.reviewCount?'<button class="ghost" data-act="reset" data-id="'+e.id+'">'+t.reset+'</button>':'')+
        '</div></div></article>';
    }
    const meaning=e.meaning
      ? '<div class="meaning">'+hl(e.meaning,q)+'</div>'
      : '<div class="meaning empty">'+t.noMeaning+'</div>';
    const sched=e.archived?'':'<span class="sched">'+(isDue(e)?t.due:t.next(dateOnly(e.due)))+
      (e.reviewCount?t.times(e.reviewCount):'')+'</span>';
    return '<article class="slip '+e.type+'">'+
      '<div class="spine"><time>'+stamp(e.created)+'</time></div>'+
      '<div class="body">'+
      '<div class="term">'+hl(e.text,q)+(e.archived?'<span class="flag">'+t.archived+'</span>':'')+'</div>'+
      meaning+
      '<div class="acts">'+
        '<button data-act="edit" data-id="'+e.id+'">'+t.edit+'</button>'+
        '<button data-act="'+(e.archived?'restore':'archive')+'" data-id="'+e.id+'">'+(e.archived?t.restore:t.archive)+'</button>'+
        '<button class="del" data-act="delete" data-id="'+e.id+'">'+t.del+'</button>'+
        sched+
      '</div></div></article>';
  }).join('');
  list.querySelectorAll('textarea').forEach(autoGrow);
}

/* ---------- 操作 ---------- */
$('list').addEventListener('click',async ev=>{
  const t=T();
  if(ev.target.closest('#do-reveal')){revealed=true;render();return}
  const g=ev.target.closest('.grades button');
  if(g){await grade(parseInt(g.dataset.q,10));return}
  const b=ev.target.closest('button[data-act]');
  if(!b)return;
  const e=entries.find(x=>x.id===b.dataset.id);
  if(!e)return;
  const act=b.dataset.act;
  if(act==='edit'){editing=e.id;render();return}
  if(act==='cancel'){editing=null;render();return}
  if(act==='save'){
    const card=b.closest('.body');
    const v=card.querySelector('.e-text').value.trim();
    if(!v){toast(t.tEmptyText);return}
    e.text=v;e.meaning=card.querySelector('.e-meaning').value.trim();
    editing=null;await save();render();toast(t.tUpdated);return;
  }
  if(act==='reset'){
    e.reps=0;e.ease=2.5;e.interval=0;e.reviewCount=0;e.lastReviewed=null;e.due=new Date().toISOString();
    editing=null;await save();render();toast(t.tReset);return;
  }
  if(act==='archive'){e.archived=true;e.archivedAt=new Date().toISOString();await save();render();toast(t.tArchived);return}
  if(act==='restore'){e.archived=false;e.archivedAt=null;await save();render();toast(t.tRestored);return}
  if(act==='delete'){
    if(!confirm(t.confirmDel(e.text.slice(0,40))))return;
    entries=entries.filter(x=>x.id!==e.id);await save();render();toast(t.tDeleted);
  }
});

async function grade(q){
  const e=entries.find(x=>x.id===queue[0]);
  if(!e)return;
  const ta=$('drill-meaning');
  if(ta&&ta.value.trim())e.meaning=ta.value.trim();
  const days=schedule(e,q);
  queue.shift();
  if(q<3)queue.push(e.id);
  revealed=false;
  await save();render();
  toast(T().tNext(T().gap(days)));
}

document.addEventListener('keydown',ev=>{
  if(view!=='review')return;
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input')return;
  if(!revealed&&(ev.code==='Space'||ev.key==='Enter')){ev.preventDefault();revealed=true;render();return}
  if(revealed&&['1','2','3'].includes(ev.key)){ev.preventDefault();grade({'1':1,'2':3,'3':5}[ev.key])}
});

/* ---------- 导出 ---------- */
function fname(ext){const d=new Date();return 'memocab-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.'+ext}
function download(content,name,mime){
  try{
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},500);
    toast(T().tExported(name));
  }catch(err){toast(T().tBlocked)}
}
function rowsForExport(){
  const t=T();
  return [...entries].sort((a,b)=>a.created<b.created?-1:1).map(e=>[
    e.type==='word'?t.vWord:t.vSentence,
    e.text,e.meaning||'',stamp(e.created),
    e.archived?t.vArchived:t.vActive,
    e.archivedAt?stamp(e.archivedAt):'',
    e.reviewCount,e.archived?'':stamp(e.due),e.interval,e.ease
  ]);
}
$('x-csv').onclick=()=>{
  if(!entries.length){toast(T().tNothing);return}
  const qt=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[T().head,...rowsForExport()].map(r=>r.map(qt).join(',')).join('\r\n');
  download(csv,fname('csv'),'text/csv;charset=utf-8');
};
$('x-xls').onclick=()=>{
  if(!entries.length){toast(T().tNothing);return}
  const cell=v=>typeof v==='number'
    ? '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>'
    : '<Cell><Data ss:Type="String">'+esc(v)+'</Data></Cell>';
  const head='<Row>'+T().head.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+esc(h)+'</Data></Cell>').join('')+'</Row>';
  const body=rowsForExport().map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('');
  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#EDEFE9" ss:Pattern="Solid"/></Style></Styles>'+
    '<Worksheet ss:Name="Memocab"><Table>'+
    '<Column ss:Width="55"/><Column ss:Width="170"/><Column ss:Width="240"/><Column ss:Width="105"/><Column ss:Width="60"/><Column ss:Width="105"/><Column ss:Width="70"/><Column ss:Width="105"/><Column ss:Width="70"/><Column ss:Width="60"/>'+
    head+body+'</Table></Worksheet></Workbook>';
  download(xml,fname('xls'),'application/vnd.ms-excel;charset=utf-8');
};

/* ---------- 启动 ---------- */
(async()=>{
  const saved=await getItem(LANGKEY);
  lang=(saved&&I18N[saved])?saved:detectLang();
  applyLang();
  entries=await load();
  syncTabs();render();
  const tick=()=>{$('clock').textContent=stamp(new Date().toISOString())};
  tick();setInterval(tick,20000);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
